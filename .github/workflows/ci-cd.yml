name: CI/CD Serverless Auth

on:
  push:
    branches: [homolog, main]
  pull_request:
    branches: [homolog, main]

permissions:
  contents: read
  id-token: write   # necessário para OIDC (configure-aws-credentials)

env:
  PYTHON_VERSION: "3.12"

jobs:
  # --------------------------------------------------------------------------
  # Qualidade — roda em PRs e pushes
  # --------------------------------------------------------------------------
  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes com cobertura
        run: pytest --cov=auth_fn --cov-report=term-missing

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Init (sem backend) + validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform

  # --------------------------------------------------------------------------
  # Deploy — só em push para homolog/main (branches protegidas, via PR)
  # --------------------------------------------------------------------------
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [test, terraform-validate]
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Empacotar a função
        run: bash scripts/build.sh

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (state por ambiente)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=serverless-auth/${DEPLOY_ENV}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        working-directory: terraform
        env:
          TF_VAR_environment: ${{ env.DEPLOY_ENV }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_vpc_id: ${{ vars.VPC_ID }}
          TF_VAR_private_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS }}
          TF_VAR_rds_security_group_id: ${{ vars.RDS_SECURITY_GROUP_ID }}
          TF_VAR_db_host: ${{ vars.DB_HOST }}
          TF_VAR_db_name: ${{ vars.DB_NAME }}
          TF_VAR_db_user: ${{ vars.DB_USER }}
          TF_VAR_db_password_secret_arn: ${{ secrets.DB_PASSWORD_SECRET_ARN }}
          TF_VAR_jwt_secret_arn: ${{ secrets.JWT_SECRET_ARN }}
