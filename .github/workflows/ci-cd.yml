name: CI/CD Serverless Auth

on:
  push:
    branches: [homolog, main]
  pull_request:
    branches: [homolog, main]

concurrency:
  group: gateway-terraform-cloud
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  TF_CLOUD_ORGANIZATION: "autocenter-fiap"
  TF_WORKSPACE: "gateway"
  TF_WORKING_DIRECTORY: "terraform"

jobs:
  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: pytest -q

  terraform-validate:
    name: Terraform fmt/validate/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Init (sem backend)
        run: terraform init -backend=false -input=false
        working-directory: terraform

      - name: Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform test
        run: terraform test
        working-directory: terraform

  deploy:
    name: Publicar imagem e acionar Terraform Cloud
    runs-on: ubuntu-latest
    needs: [test, terraform-validate]
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      LAMBDA_ECR_REPOSITORY_URL: ${{ vars.LAMBDA_ECR_REPOSITORY_URL }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuração obrigatória do deploy
        run: |
          missing=0
          for var_name in AWS_REGION AWS_DEPLOY_ROLE_ARN LAMBDA_ECR_REPOSITORY_URL; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::$var_name não configurado no GitHub."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configurar credenciais AWS para publicar no ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir URI da imagem
        id: image
        run: |
          image_tag="sha-${GITHUB_SHA::12}"
          image_uri="${LAMBDA_ECR_REPOSITORY_URL}:${image_tag}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Lambda
        run: IMAGE_TAG=${{ steps.image.outputs.image_uri }} bash scripts/build.sh

      - name: Push da imagem para o ECR
        run: docker push ${{ steps.image.outputs.image_uri }}

      - name: Gerar tfvars efêmero para o run remoto
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path(os.environ["TF_WORKING_DIRECTORY"]) / "deploy.auto.tfvars.json"
          target.write_text(
              json.dumps({"lambda_image_uri": os.environ["IMAGE_URI"]}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Avisar ausência de TF_API_TOKEN
        if: ${{ env.TF_API_TOKEN == '' }}
        run: |
          echo "::warning::A imagem foi publicada no ECR, mas o run remoto do Terraform Cloud não foi acionado porque o secret TF_API_TOKEN não está configurado. Configure também o workspace gateway em modo API/CLI-driven com working directory terraform/."

      - name: Upload da configuração ao Terraform Cloud
        if: ${{ env.TF_API_TOKEN != '' }}
        id: upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: .

      - name: Criar run remoto no Terraform Cloud
        if: ${{ env.TF_API_TOKEN != '' }}
        id: create-run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          message: "Deploy da Lambda auth (${{ github.sha }})"

      - name: Confirmar apply remoto quando necessário
        if: ${{ env.TF_API_TOKEN != '' && fromJSON(steps.create-run.outputs.payload).data.attributes.actions['is-confirmable'] }}
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        with:
          run: ${{ steps.create-run.outputs.run_id }}
          comment: "Apply remoto aprovado pelo GitHub Actions em ${{ github.sha }}"

      - name: Exibir link do run
        if: ${{ env.TF_API_TOKEN != '' }}
        run: echo "Run Terraform Cloud: ${{ steps.create-run.outputs.run_link }}"
