AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Auto Center FIAP — Function Serverless de autenticação por CPF.
  Template usado para execução local (sam local invoke / start-api).
  O provisionamento em nuvem é feito via Terraform (ver terraform/).

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.12

Parameters:
  JwtSecret:
    Type: String
    Default: "123456789"
  JwtIssuer:
    Type: String
    Default: "Auto Center Fiap"
  JwtExpMinutes:
    Type: String
    Default: "30"
  DbHost:
    Type: String
    Default: "host.docker.internal"
  DbPort:
    Type: String
    Default: "3306"
  DbName:
    Type: String
    Default: "autocenterdb"
  DbUser:
    Type: String
    Default: "autocenter"
  DbPassword:
    Type: String
    Default: "autocenter123"

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: auth_fn.handler.handler
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          JWT_ISSUER: !Ref JwtIssuer
          JWT_EXP_MINUTES: !Ref JwtExpMinutes
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
      Events:
        Auth:
          Type: Api
          Properties:
            Path: /auth
            Method: post
    Metadata:
      BuildMethod: python3.12

Outputs:
  AuthApi:
    Description: "Endpoint local do POST /auth"
    Value: "http://127.0.0.1:3000/auth"
